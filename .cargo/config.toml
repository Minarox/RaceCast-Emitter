# Build environment of the LiveKit SDK (webrtc-sys) on this Jetson — see docs/SPEC.md §6.
# libwebrtc ships a hermetic libc++ that needs clang >= 21; the Jetson MMAPI encoder of JetPack 7 needs
# an explicit link to libnvbufsurface (missing from the SDK's lazy-loading stubs).
[env]
CC = "/home/jetson/src/LLVM-23.1.2-Linux-ARM64/bin/clang"
CXX = "/home/jetson/src/LLVM-23.1.2-Linux-ARM64/bin/clang++"

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-L/usr/lib/aarch64-linux-gnu/nvidia",
    "-C", "link-arg=-Wl,--no-as-needed",
    "-C", "link-arg=-lnvbufsurface",
]
