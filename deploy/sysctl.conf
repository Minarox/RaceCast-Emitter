# RaceCast: recorded data reaches the NVMe within ~1 s (docs/SPEC.md §9c).
# Installed as /etc/sysctl.d/90-racecast.conf by deploy/install.sh.
#
# By default, written data may stay up to ~30 s in the page cache (expiry 3000 cs, flusher every 500 cs):
# a power cut would lose that much recording. The recordings are a few MB/s, so flushing every second
# costs nothing noticeable.
vm.dirty_expire_centisecs = 100
vm.dirty_writeback_centisecs = 100
