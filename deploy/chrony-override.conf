# RaceCast: let racecast-emitter (user jetson) write into the GPS refclock socket (docs/SPEC.md §7).
# Installed as /etc/systemd/system/chrony.service.d/racecast.conf by deploy/install.sh.
#
# chronyd binds the socket as root, before dropping its privileges, with mode 0755: only root could write
# to it. Once chronyd is ready (Type=forking), the socket is handed to the jetson group.
# "+": runs outside chrony's sandbox; "-": chrony still starts if the socket is missing.
[Service]
ExecStartPost=-+/bin/sh -c 'chgrp jetson /run/chrony.racecast.sock && chmod 0660 /run/chrony.racecast.sock'
