# RaceCast: modem GPS as a fallback time source (docs/SPEC.md §7).
# Installed as /etc/chrony/conf.d/racecast.conf by deploy/install.sh.
#
# racecast-emitter sends the time of every valid NMEA RMC sentence to this socket (once per second with a
# fix). The modem has no PPS and its NMEA output lags the fix, hence the large `delay`: NTP servers (a few
# tens of ms of root distance) always win and are never averaged with the GPS, which only takes over when
# no server is reachable. `offset` compensates the NMEA latency, measured with the clock synchronized over
# NTP: the GPS offset shown by `chronyc sourcestats` (positive when the sentences are late), in seconds
# (SPEC §11).
# Measured on 2026-09-28 (3D fix, clock synchronized over NTP): +20 ms, std dev 0.75 ms over 200 s.
refclock SOCK /run/chrony.racecast.sock refid GPS delay 0.5 offset 0.020
