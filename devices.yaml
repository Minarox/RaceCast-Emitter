# UID : udevadm info --query=property --name=/dev/video0 | grep ID_SERIAL
# Supported formats : v4l2-ctl --list-formats-ext -d /dev/video0
cameras:
  - uid: "Generic_USB_Camera_200901010001"
    name: "Route"
    width: 1920
    height: 1080
    framerate: 30
    vertical_flip: true
    horizontal_flip: true
    stream:
      bitrate: 2000000

  - uid: "HD_USB_Camera_HD_USB_Camera"
    name: "Habitacle"
    width: 1920
    height: 1080
    framerate: 30
    vertical_flip: true
    horizontal_flip: true
    stream:
      width: 852
      height: 480
      bitrate: 400000


microphones:
  - uid: "Generic_USB_Camera_200901010001"
    name: "Habitacle"
    sample_rate: 48000
    channels: 2
    stream:
      bitrate: 24000
