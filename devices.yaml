# List devices : v4l2-ctl --list-devices
# UID : udevadm info --query=property --name=/dev/video0 | grep ID_SERIAL
# Supported formats : v4l2-ctl --list-formats-ext -d /dev/video0
cameras:
  - uid: "Generic_USB_Camera_200901010001"
    name: "Route"
    width: 1920
    height: 1080
    framerate: 30
    vertical_flip: true
    horizontal_flip: true
    # main: this camera's stream never gets paused for lack of shared
    # bandwidth and always gets first claim on it (see
    # internal/pipeline/bandwidth.go) — at most one camera may set this.
    main: true
    stream:
      width: 960
      height: 540
      framerate: 30
      bitrate: 1000000

  - uid: "HD_USB_Camera_HD_USB_Camera"
    name: "Habitacle"
    width: 1920
    height: 1080
    framerate: 30
    vertical_flip: true
    horizontal_flip: true
    stream:
      width: 854
      height: 480
      framerate: 25
      bitrate: 400000


# List devices : arecord -l
# UID : udevadm info --query=property --name=/dev/snd/pcmC0D0c | grep ID_SERIAL
# Supported formats : arecord -D hw:0,0 --dump-hw-params
microphones:
  - uid: "Generic_USB_Camera_200901010001"
    name: "Habitacle"
    sample_rate: 48000
    channels: 2
    stream:
      bitrate: 24000
      channels: 1  # downmix to mono for streaming only; local recording stays stereo
